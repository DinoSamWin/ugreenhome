<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备接入编排中心</title><style>html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#172033}.loading{height:100%;display:grid;place-items:center}.box{text-align:center}.spinner{width:34px;height:34px;border:3px solid #dbe4f0;border-top-color:#2563eb;border-radius:50%;margin:0 auto 16px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.muted{color:#667085;font-size:13px}</style></head><body><div class="loading"><div class="box"><div class="spinner"></div><strong>正在加载设备接入编排中心</strong><div class="muted" style="margin-top:8px">首次打开可能需要几秒</div></div></div><script>(async()=>{try{const files=['payload/00.txt','payload/01.txt','payload/02_04.txt','payload/05_08.txt'];const parts=await Promise.all(files.map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(x+' '+r.status);return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="padding:40px;font-family:sans-serif"><h2>页面加载失败</h2><p>'+String(e)+'</p><p>请刷新页面重试。</p></div>';console.error(e)}})();</script></body></html>
